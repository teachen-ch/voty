# docker-compose.yml
services:
  traefik:
    image: traefik:3.6
    container_name: traefik
    restart: always
    sysctls:
      # CVE-2026-98432: no MPTCP listeners (Go opens them by default) until the kernel is patched
      - net.mptcp.enabled=0
    depends_on:
      - docker-proxy
    networks:
      default:
    command:
      - "--log.level=info"
      - "--log.filePath=/var/log/traefik/traefik.log"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.votyresolver.acme.email=voty@teachen.ch"
      - "--certificatesresolvers.votyresolver.acme.storage=/etc/traefik/acme/acme.json"
      - "--certificatesresolvers.votyresolver.acme.httpchallenge.entrypoint=web"
      # LetsEncrypt Staging Server - uncomment when testing
      # - "--certificatesResolvers.votyresolver.acme.caServer=https://acme-staging-v02.api.letsencrypt.org/directory"
    volumes:
      - ./traefik/rules:/rules
      - ./traefik/acme:/etc/traefik/acme
      - ./traefik/logs:/var/log/traefik
      - ./traefik/shared:/shared
    ports:
      - "80:80"
      - "443:443"

  docker-proxy:
    container_name: "docker-proxy"
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: always
    environment:
      CONTAINERS: 1
      EVENTS: 1
      NETWORKS: 1
      POST: 0
    volumes:
      - {{ docker_socket }}:/var/run/docker.sock:ro
    expose:
      - "2375"

  nginx:
    container_name: "nginx"
    env_file: ".env"
    image: nginx:alpine
    depends_on:
      - app
      - traefik
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./maintenance:/voty/maintenance
    command: ["nginx", "-g", "daemon off;"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.nginx.rule=(${HOSTS})
      - traefik.http.routers.nginx.entrypoints=websecure
      - traefik.http.routers.nginx.tls=true
      - traefik.http.routers.nginx.tls.certresolver=votyresolver
      - traefik.http.middlewares.www-redirect.redirectregex.regex=^https?://(?:www\.)?(.*)voty.ch/(.*)
      - traefik.http.middlewares.www-redirect.redirectregex.replacement=https://$${1}voty.ch/$${2}
      - traefik.http.middlewares.www-redirect.redirectregex.permanent=true
      - traefik.http.routers.nginx.middlewares=www-redirect@docker
      #- traefik.http.services.nginx.loadbalancer.server.port=80

  app:
    container_name: "app"
    env_file: ".env"
    image: ghcr.io/teachen-ch/voty/voty
    restart: always
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: 1
    volumes:
      - ./logs:/usr/src/app/logs
      - ./uploads:/usr/src/app/uploads
    expose:
      - "3000"
    command: npm run start

  civictools:
    container_name: "civictools"
    env_file: ".env"
    image: ghcr.io/teachen-ch/voty/civictools
    restart: always
    sysctls:
      - net.mptcp.enabled=0
    environment:
      - GOMEMLIMIT=512MiB
      - CIVICTOOLS_DYNAMIC_APP_URL={{ civictools_dynamic_app_url }}
      - CIVICTOOLS_ALLOWED_HOSTS={{ civictools_allowed_hosts | join(',') }}
    volumes:
      - ./pb_data:/app/pb/pb_data
    expose:
      - "8090"
    labels:
      - traefik.enable=true
      - traefik.http.routers.civictools.rule={{ civictools_host_rule }}
      - traefik.http.routers.civictools.entrypoints=websecure
      - traefik.http.routers.civictools.tls=true
      - traefik.http.routers.civictools.tls.certresolver=votyresolver
      - traefik.http.services.civictools.loadbalancer.server.port=8090

  postgres:
    image: "postgres:17-alpine"
    container_name: "postgres"
    restart: always
    expose:
      - "5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: voty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: voty
    # command: postgres -c archive_mode=on -c archive_timeout=600
