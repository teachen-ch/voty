overwrite: true
schema: "graphql/api.graphql"
documents: ["**/*.tsx"]
generates:
  graphql/types.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
      #- "typescript-document-nodes"
      - "fragment-matcher"
    config:
      reactApolloVersion: 3
      withHooks: true
      withHOC: false
      withComponent: false
      addDocBlocks: false
      scalars:
        DateTime: any
        Json: any
      # The v6 operations plugin re-emits schema types by default, which
      # duplicates the definitions the typescript plugin writes above. Point
      # it at the same output file so it references those types instead.
      importSchemaTypesFrom: "graphql/types"
  graphql/modules.d.ts:
    plugins:
      - "typescript-graphql-files-modules"
