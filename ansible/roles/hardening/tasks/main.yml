---
- name: Install firewall and intrusion prevention packages
  apt:
    name:
      - ufw
      - fail2ban
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Harden sshd
  copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    mode: "0644"
    content: |
      PermitRootLogin no
      X11Forwarding no
      MaxAuthTries 3
      AllowUsers ubuntu app
  notify: restart ssh

- name: Validate sshd configuration
  command: sshd -t
  changed_when: false

- name: Allow SSH before enabling the firewall
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp

- name: Allow HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"
    - "443"

- name: Default-deny incoming traffic
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Configure fail2ban sshd jail
  copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      findtime = 10m
      bantime = 1h
  notify: restart fail2ban

- name: Enable and start fail2ban
  systemd:
    name: fail2ban
    enabled: yes
    state: started

# CVE-2026-98432: the IPv4 TCP handshake use-after-free is reachable through
# SYN options, so drop inbound TCP packets whose IPv4 header carries any.
# Interim mitigation only — remove the unit once the fixed kernel is running.
- name: Install nftables
  apt:
    name: nftables
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Create nftables include directory
  file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"

- name: Deploy CVE-2026-98432 nftables ruleset
  copy:
    dest: /etc/nftables.d/cve-2026-98432.nft
    mode: "0644"
    content: |
      table ip cve_2026_98432 {
        chain pre {
          type filter hook prerouting priority -300; policy accept;
          meta l4proto tcp ip hdrlength gt 5 counter drop
        }
      }

- name: Deploy CVE-2026-98432 systemd unit
  copy:
    dest: /etc/systemd/system/cve-2026-98432.service
    mode: "0644"
    content: |
      [Unit]
      Description=Drop IPv4 TCP packets with IP options (CVE-2026-98432 mitigation)
      After=network-pre.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStartPre=-/usr/sbin/nft delete table ip cve_2026_98432
      ExecStart=/usr/sbin/nft -f /etc/nftables.d/cve-2026-98432.nft
      ExecStop=/usr/sbin/nft delete table ip cve_2026_98432

      [Install]
      WantedBy=multi-user.target

- name: Enable CVE-2026-98432 mitigation
  systemd:
    name: cve-2026-98432
    daemon_reload: yes
    enabled: yes
    state: started

# Covers the host netns (rootlesskit holds :80/:443 there); containers get
# their own sysctl because new network namespaces start with MPTCP enabled.
- name: Disable multipath TCP on the host
  sysctl:
    name: net.mptcp.enabled
    value: "0"
    sysctl_file: /etc/sysctl.d/90-disable-mptcp.conf
    state: present
    reload: yes
